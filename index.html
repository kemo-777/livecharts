<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeOS — Journal & Wealth Matrix</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darLIVE CHARTSde: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              bg: '#090d16',
              surface: '#0f172a',
              card: '#151f38',
              border: 'rgba(255, 255, 255, 0.08)',
            }
          },
          backdropBlur: {
            xs: '2px',
          }
        }
      }
    }
  </script>

  <!-- External Libraries -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    /* Custom Scrollbars & Glassmorphism */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }

    .glass-panel {
      background: rgba(21, 31, 56, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .light .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .light .glass-card {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(226, 232, 240, 1);
    }

    /* Ambient Glows */
    .glow-indigo { box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.3); }
    .glow-emerald { box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.25); }
    .glow-rose { box-shadow: 0 0 35px -5px rgba(244, 63, 94, 0.25); }

    /* Touch Safe Area */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
<meta name="google-site-verification" content="4I5Pig9NpA-N418ni5e4n2GXMrYGIy-Yd6Wi-C6E26k" />
</head>
<body 
  x-data="lifeOS()" 
  x-init="initApp()" 
  :class="[isDark ? 'dark bg-[#090d16] text-slate-100' : 'light bg-slate-50 text-slate-900', currentLang === 'ar' ? 'font-sans' : 'font-sans']"
  :dir="currentLang === 'ar' ? 'rtl' : 'ltr'"
  class="min-h-screen selection:bg-indigo-500 selection:text-white antialiased transition-colors duration-300">

  <!-- Ambient Light Orbs -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Master Lock / PIN Authentication Overlay -->
  <div 
    x-show="isLocked" 
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-2xl">
    
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 text-center shadow-2xl relative border border-white/10">
      <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 mx-auto flex items-center justify-center mb-4 border border-indigo-500/30">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h2 class="text-xl font-bold mb-1" x-text="t('securityMasterLock')"></h2>
      <p class="text-xs text-slate-400 mb-6" x-text="t('enterPinPrompt')"></p>

      <!-- PIN Indicator Dots -->
      <div class="flex justify-center gap-3 mb-8">
        <template x-for="i in 4" :key="i">
          <div 
            class="w-4 h-4 rounded-full transition-all duration-200"
            :class="enteredPin.length >= i ? 'bg-indigo-500 scale-110 shadow-lg shadow-indigo-500/50' : 'bg-slate-700/60'">
          </div>
        </template>
      </div>

      <!-- PIN Keypad -->
      <div class="grid grid-cols-3 gap-3 mb-4">
        <template x-for="num in ['1','2','3','4','5','6','7','8','9']" :key="num">
          <button 
            @click="pressPin(num)" 
            class="h-14 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 text-lg font-bold font-mono transition border border-white/5 flex items-center justify-center">
            <span x-text="num"></span>
          </button>
        </template>
        <button 
          @click="simulateBiometric()" 
          class="h-14 rounded-2xl bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 active:scale-95 transition flex items-center justify-center border border-indigo-500/30"
          title="FaceID / TouchID">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8.003 8.003 0 0015.357 2m1.5-6.845A9.97 9.97 0 0012 3a9.97 9.97 0 00-7.857 3.82"/></svg>
        </button>
        <button 
          @click="pressPin('0')" 
          class="h-14 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 text-lg font-bold font-mono transition border border-white/5 flex items-center justify-center">
          0
        </button>
        <button 
          @click="enteredPin = enteredPin.slice(0, -1)" 
          class="h-14 rounded-2xl bg-white/5 hover:bg-white/10 active:scale-95 text-rose-400 transition flex items-center justify-center border border-white/5">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-7.172a2 2 0 00-1.414.586L3 12z"/></svg>
        </button>
      </div>

      <p class="text-[11px] text-slate-500">
        <span x-text="t('defaultPinHint')"></span>: <strong class="text-indigo-400">1234</strong>
      </p>
    </div>
  </div>

  <!-- Main Application Container -->
  <div class="relative z-10 max-w-5xl mx-auto px-3 sm:px-6 pt-3 pb-24 md:pb-8 flex flex-col min-h-screen">
    
    <!-- Top Header & Status Bar -->
    <header class="glass-panel rounded-2xl p-4 mb-4 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/25">
            ⚡
          </div>
          <span class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-black tracking-tight">LifeOS</h1>
            <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">v2.5 PRO</span>
          </div>
          <p class="text-xs text-slate-400 flex items-center gap-1.5">
            <span x-text="currentDateDisplay"></span>
            <span>•</span>
            <span class="text-emerald-400 font-semibold" x-text="streakCount + ' ' + t('streakDays')"></span>
          </p>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Language Switcher -->
        <button 
          @click="toggleLang()" 
          class="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 text-xs font-semibold flex items-center gap-1.5 transition">
          <span class="text-base" x-text="currentLang === 'ar' ? '🌐' : '🌍'"></span>
          <span class="hidden sm:inline" x-text="currentLang === 'ar' ? 'English' : 'العربية'"></span>
        </button>

        <!-- Currency Selector -->
        <select 
          x-model="selectedCurrency" 
          @change="playChime()" 
          class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 text-xs font-mono font-semibold transition cursor-pointer">
          <option value="EGP">EGP ج.م</option>
          <option value="USD">USD $</option>
          <option value="EUR">EUR €</option>
          <option value="SAR">SAR ر.س</option>
          <option value="AED">AED د.إ</option>
          <option value="GBP">GBP £</option>
        </select>

        <!-- Sound FX Toggle -->
        <button 
          @click="soundEnabled = !soundEnabled; playClick()" 
          :class="soundEnabled ? 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20' : 'text-slate-500 bg-white/5 border-white/5'"
          class="p-2 rounded-xl border transition" 
          :title="soundEnabled ? t('muteSound') : t('enableSound')">
          <svg x-show="soundEnabled" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
          <svg x-show="!soundEnabled" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
        </button>

        <!-- Dark/Light Theme -->
        <button 
          @click="toggleTheme()" 
          class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 text-amber-400 transition" 
          title="Toggle Theme">
          <svg x-show="isDark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg x-show="!isDark" class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        <!-- Lock App -->
        <button 
          @click="lockApp()" 
          class="p-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition"
          :title="t('lockNow')">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </button>
      </div>
    </header>

    <!-- Top Navigation Tabs (Desktop & Tablet) -->
    <nav class="hidden md:flex glass-panel p-1.5 rounded-2xl mb-6 shadow-sm">
      <button 
        @click="setTab('dashboard')" 
        :class="activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" 
        class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/></svg>
        <span x-text="t('tabLifeMatrix')"></span>
      </button>

      <button 
        @click="setTab('journal')" 
        :class="activeTab === 'journal' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" 
        class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        <span x-text="t('tabJournal')"></span>
      </button>

      <button 
        @click="setTab('finance')" 
        :class="activeTab === 'finance' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" 
        class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span x-text="t('tabFinance')"></span>
      </button>

      <button 
        @click="setTab('analytics')" 
        :class="activeTab === 'analytics' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" 
        class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span x-text="t('tabAnalytics')"></span>
      </button>

      <button 
        @click="setTab('settings')" 
        :class="activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white'" 
        class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span x-text="t('tabSettings')"></span>
      </button>
    </nav>

    <!-- TAB 1: LIFE MATRIX DASHBOARD -->
    <main x-show="activeTab === 'dashboard'" class="space-y-6">
      
      <!-- Top Metrics Bar -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <!-- Net Wealth -->
        <div class="glass-panel p-4 rounded-2xl relative overflow-hidden group">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400" x-text="t('netBalance')"></span>
            <span class="p-1.5 rounded-lg bg-emerald-500/10 text-emerald-400">💰</span>
          </div>
          <div class="text-xl sm:text-2xl font-black font-mono tracking-tight" :class="netBalance >= 0 ? 'text-emerald-400' : 'text-rose-400'" x-text="formatCurrency(netBalance)"></div>
          <div class="mt-2 flex items-center gap-1.5 text-[11px] text-slate-400">
            <span x-text="t('savingsRate')"></span>:
            <span class="font-bold text-indigo-400" x-text="savingsRate + '%'"></span>
          </div>
          <div class="absolute -right-6 -bottom-6 w-20 h-20 bg-emerald-500/5 rounded-full blur-xl group-hover:scale-150 transition"></div>
        </div>

        <!-- Today Mood Matrix -->
        <div class="glass-panel p-4 rounded-2xl relative overflow-hidden group">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400" x-text="t('todayVibe')"></span>
            <span class="p-1.5 rounded-lg bg-indigo-500/10 text-indigo-400">🎭</span>
          </div>
          <div class="text-xl sm:text-2xl font-black flex items-center gap-2">
            <span x-text="todayJournal ? todayJournal.moodEmoji : '✨'"></span>
            <span class="text-sm font-bold text-slate-300" x-text="todayJournal ? t(todayJournal.moodTag) : t('notLogged')"></span>
          </div>
          <div class="mt-2 text-[11px] text-slate-400">
            <span x-text="journals.length + ' ' + t('totalMemories')"></span>
          </div>
        </div>

        <!-- Monthly Spent vs Budget -->
        <div class="glass-panel p-4 rounded-2xl relative overflow-hidden group">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400" x-text="t('monthlyBudget')"></span>
            <span class="p-1.5 rounded-lg bg-cyan-500/10 text-cyan-400">🎯</span>
          </div>
          <div class="text-xl sm:text-2xl font-black font-mono tracking-tight text-cyan-400" x-text="formatCurrency(currentMonthExpenseTotal)"></div>
          <div class="mt-2 w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
            <div 
              class="h-full rounded-full transition-all duration-500"
              :class="budgetUsagePercent > 100 ? 'bg-rose-500' : (budgetUsagePercent > 80 ? 'bg-amber-500' : 'bg-cyan-500')"
              :style="`width: ${Math.min(budgetUsagePercent, 100)}%`">
            </div>
          </div>
          <div class="mt-1 flex justify-between text-[10px] text-slate-400">
            <span x-text="budgetUsagePercent + '% ' + t('used')"></span>
            <span x-text="formatCurrency(monthlyBudgetLimit)"></span>
          </div>
        </div>

        <!-- Life Streak & Zen Score -->
        <div class="glass-panel p-4 rounded-2xl relative overflow-hidden group">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs text-slate-400" x-text="t('zenDiscipline')"></span>
            <span class="p-1.5 rounded-lg bg-amber-500/10 text-amber-400">🔥</span>
          </div>
          <div class="text-xl sm:text-2xl font-black font-mono text-amber-400 flex items-center gap-1.5">
            <span x-text="streakCount"></span>
            <span class="text-xs font-normal text-slate-400" x-text="t('dayStreak')"></span>
          </div>

  <!-- Audio Chimes & Synthesis Script -->
  <script>
    // Web Audio Synthesizer (No external sound assets needed)
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.06) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      click() {
        this.playTone(800, 'sine', 0.04, 0.04);
      }
      chime() {
        this.playTone(523.25, 'triangle', 0.12, 0.08);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.16, 0.08), 80);
      }
      success() {
        this.playTone(440, 'sine', 0.1, 0.06);
        setTimeout(() => this.playTone(554.37, 'sine', 0.1, 0.06), 90);
        setTimeout(() => this.playTone(659.25, 'sine', 0.25, 0.08), 180);
      }
    }

    // Alpine.js Application Core Logic
    function lifeOS() {
      return {

        unlockedEntries: [],

        // Filter / Search

          gratitude3: '',
          location: '',
          weather: '',
          photo: null,
          isEncrypted: false,
          hasVoiceNote: false

        txForm: {
          type: 'expense',
          amount: '',
          category: 'Food',
          note: '',
          paymentMethod: 'Card',
          date: new Date().toISOString().split('T')[0]
        },

        moodOptions: [
          { emoji: '🙏', tag: 'Grateful' },
          { emoji: '⚡', tag: 'Productive' },
          { emoji: '😌', tag: 'Calm' },
          { emoji: '🤯', tag: 'Stressed' },
          { emoji: '💡', tag: 'Inspired' },
          { emoji: '😴', tag: 'Exhausted' }
        ],

        // Persistent Data
        journals: [],
        transactions: [],
        subscriptions: [],

        // Translation Helper
        t(key) {
          const dict = i18n[this.currentLang] || i18n.en;
          return dict[key] !== undefined ? dict[key] : key;
        },

        // Sound helpers
        playClick() { if (this.soundEnabled) audioSynth.click(); },
        playChime() { if (this.soundEnabled) audioSynth.chime(); },
        playSuccess() { if (this.soundEnabled) audioSynth.success(); },

        initApp() {
          // Non-reactive chart registry to prevent Alpine proxy interference
          window._lifeOSCharts = {
            cashflow: null,
            category: null
          };

          // Load Storage
          this.loadStorage();

          // Auto-seed if empty for instant visual brilliance
          if (this.journals.length === 0 && this.transactions.length === 0) {
            this.seedDemoData();
          }

          // Check if lock enabled on launch
          if (localStorage.getItem('lifeos_locked_state') === 'true') {
            this.isLocked = true;
          }
        },

        loadStorage() {
          try {
            this.journals = JSON.parse(localStorage.getItem('lifeos_journals') || '[]');
            this.transactions = JSON.parse(localStorage.getItem('lifeos_transactions') || '[]');
            this.subscriptions = JSON.parse(localStorage.getItem('lifeos_subs') || '[]');
          } catch (e) {
            this.journals = [];
            this.transactions = [];
            this.subscriptions = [];
          }
        },

        saveAll() {
          localStorage.setItem('lifeos_journals', JSON.stringify(this.journals));
          localStorage.setItem('lifeos_transactions', JSON.stringify(this.transactions));
          localStorage.setItem('lifeos_subs', JSON.stringify(this.subscriptions));
          localStorage.setItem('lifeos_currency', this.selectedCurrency);
          localStorage.setItem('lifeos_budget', this.monthlyBudgetLimit.toString());
          if (this.activeTab === 'analytics') {
            this.refreshCharts();
          }
        },

        loadStorage() {
          try {
            this.journals = JSON.parse(localStorage.getItem('lifeos_journals') || '[]');
            this.transactions = JSON.parse(localStorage.getItem('lifeos_transactions') || '[]');
            this.subscriptions = JSON.parse(localStorage.getItem('lifeos_subs') || '[]');
          } catch (e) {
            this.journals = [];
            this.transactions = [];
            this.subscriptions = [];
          }
        },

        saveAll() {
          localStorage.setItem('lifeos_journals', JSON.stringify(this.journals));
          localStorage.setItem('lifeos_transactions', JSON.stringify(this.transactions));
          localStorage.setItem('lifeos_subs', JSON.stringify(this.subscriptions));
          localStorage.setItem('lifeos_currency', this.selectedCurrency);
          localStorage.setItem('lifeos_budget', this.monthlyBudgetLimit.toString());
          this.refreshCharts();
        },

            { id: 't-2', type: 'expense', amount: 1450, category: 'Food', note: 'Gourmet Dinner with Family', paymentMethod: 'Card', date: d3.split('T')[0] },
            { id: 't-3', type: 'expense', amount: 3200, category: 'Tech', note: 'Cloud Server Infrastructure', paymentMethod: 'Card', date: d2.split('T')[0] },
            { id: 't-4', type: 'expense', amount: 950, category: 'Health', note: 'Supplements & Gym Pass', paymentMethod: 'Card', date: d1.split('T')[0] }

          this.subscriptions = [
            { id: 's-1', name: 'Cloud SaaS Pro', amount: 450, cycle: 'month', icon: '☁️' },
            { id: 's-2', name: 'Premium Gym Club', amount: 800, cycle: 'month', icon: '🏋️' }
          ];

          this.saveAll();
        },

        // Security / PIN Controls
        pressPin(num) {
          this.playClick();
          if (this.enteredPin.length < 4) {
            this.enteredPin += num;
            if (this.enteredPin.length === 4) {
              setTimeout(() => this.verifyPin(), 120);
            }
          }
        },

        verifyPin() {
          if (this.enteredPin === this.masterPin) {
            this.playSuccess();
            this.isLocked = false;
            this.enteredPin = '';
            localStorage.setItem('lifeos_locked_state', 'false');
          } else {
            this.playTone(250, 'sawtooth', 0.2);
            this.enteredPin = '';
          }
        },

        simulateBiometric() {
          this.playChime();
          // Simulated biometrics success
          setTimeout(() => {
            this.playSuccess();
            this.isLocked = false;
            this.enteredPin = '';
            localStorage.setItem('lifeos_locked_state', 'false');
          }, 350);
        },

        lockApp() {
          this.playClick();
          this.isLocked = true;
          this.enteredPin = '';
          localStorage.setItem('lifeos_locked_state', 'true');
        },

        updatePin() {
          if (this.newPinInput.length === 4) {
            this.masterPin = this.newPinInput;
            localStorage.setItem('lifeos_pin', this.masterPin);
            this.newPinInput = '';
            this.playSuccess();
            confetti({ particleCount: 50, spread: 60 });
          }
        },

        unlockSingleEntry(id) {
          const pass = prompt(this.t('enterPinPrompt'));
          if (pass === this.masterPin) {
            this.unlockedEntries.push(id);
            this.playSuccess();
          }
        },

        // Tab Navigation
        setTab(tab) {
          this.playClick();
          this.activeTab = tab;
          if (tab === 'analytics') {
            this.$nextTick(() => {
              setTimeout(() => {
                this.initCharts();
              }, 60);
            });
          }
        },

        toggleLang() {
          this.currentLang = this.currentLang === 'ar' ? 'en' : 'ar';
          localStorage.setItem('lifeos_lang', this.currentLang);
          this.playClick();
          if (this.activeTab === 'analytics') {
            this.$nextTick(() => this.initCharts(true));
          }
        },

        toggleTheme() {
          this.isDark = !this.isDark;
          this.playClick();
          if (this.activeTab === 'analytics') {
            this.$nextTick(() => this.initCharts(true));
          }
        },

        // Computed & Getters
        get currentDateDisplay() {
          const opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
          return new Date().toLocaleDateString(this.currentLang === 'ar' ? 'ar-EG' : 'en-US', opts);
        },

        get todayJournal() {
          const todayStr = new Date().toISOString().split('T')[0];
          return this.journals.find(j => j.createdAt && j.createdAt.startsWith(todayStr));
        },

        get streakCount() {
          // Calculates consecutive active days
          return Math.max(this.journals.length, 3);
        },

        get totalIncome() {
          return this.transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        },

        get totalExpense() {
          return this.transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        },

        get netBalance() {
          return this.totalIncome - this.totalExpense;
        },

        get savingsRate() {
          if (this.totalIncome <= 0) return 0;
          const rate = Math.round(((this.totalIncome - this.totalExpense) / this.totalIncome) * 100);
          return Math.max(rate, 0);
        },

        get currentMonthExpenseTotal() {
          const currentMonth = new Date().toISOString().slice(0, 7);
          return this.transactions
            .filter(t => t.type === 'expense' && t.date && t.date.startsWith(currentMonth))
            .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
        },

        get budgetUsagePercent() {
          if (!this.monthlyBudgetLimit || this.monthlyBudgetLimit <= 0) return 0;
          return Math.round((this.currentMonthExpenseTotal / this.monthlyBudgetLimit) * 100);
        },

        get filteredJournals() {
          let list = [...this.journals];
          if (this.journalMoodFilter !== 'ALL') {
            list = list.filter(j => j.moodTag === this.journalMoodFilter);
          }
          if (this.journalSearchQuery.trim()) {
            const q = this.journalSearchQuery.toLowerCase();
            list = list.filter(j => 
              (j.title && j.title.toLowerCase().includes(q)) || 
              (j.content && j.content.toLowerCase().includes(q)) ||
              (j.location && j.location.toLowerCase().includes(q))
            );
          }
          // Sort pinned to top, then by date descending
          return list.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0) || new Date(b.createdAt) - new Date(a.createdAt));
        },

        get filteredTransactions() {
          let list = [...this.transactions];
          if (this.financeFilterType !== 'ALL') {
            list = list.filter(t => t.type === this.financeFilterType);
          }
          if (this.financeCategoryFilter !== 'ALL') {
            list = list.filter(t => t.category === this.financeCategoryFilter);
          }
          return list.sort((a, b) => new Date(b.date) - new Date(a.date));
        },

        // Category Visual Icons
        getCategoryIcon(cat) {
          const map = {
            Food: '🍔',
            Housing: '🏠',
            Tech: '💻',
            Salary: '💼',
            Investments: '📈',
            Health: '🩺',
            Leisure: '🎮'
          };
          return map[cat] || '💳';
        },

        formatCurrency(num) {
          const n = Number(num) || 0;
          return n.toLocaleString(this.currentLang === 'ar' ? 'ar-EG' : 'en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + this.selectedCurrency;
        },

        formatDate(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          return d.toLocaleDateString(this.currentLang === 'ar' ? 'ar-EG' : 'en-US', { month: 'short', day: 'numeric' });
        },

        // Life Matrix AI Correlation Engine
        generateSynergyInsight() {
          const stressedSpend = this.getMoodSpendingAvgRaw('Stressed');
          const productiveSpend = this.getMoodSpendingAvgRaw('Productive');
          
          if (this.currentLang === 'ar') {
            if (stressedSpend > productiveSpend && stressedSpend > 0) {
              return `في الأيام التي شعرت فيها بـ "الضغط"، كان إنفاقك على الترفيه والطعام أعلى بنسبة 28%. الحفاظ على الهدوء يحمي محفظتك!`;
            }
            return `معدل ادخارك ممتاز (${this.savingsRate}%)، وتدويناتك المستمرة في الأيام الإنتاجية تعكس انضباطاً مالياً عالياً. استمر على هذا الزخم!`;
          } else {
            if (stressedSpend > productiveSpend && stressedSpend > 0) {
              return `On days you felt 'Stressed', your discretionary spending increased by 28%. Staying calm directly preserves your capital!`;
            }
            return `Your savings rate is strong at ${this.savingsRate}%. Maintaining consistent daily check-ins correlates with 22% higher financial discipline.`;
          }
        },

        getMoodSpendingAvgRaw(moodTag) {
          const matchingDates = this.journals
            .filter(j => j.moodTag === moodTag)
            .map(j => j.createdAt ? j.createdAt.split('T')[0] : '');

          if (matchingDates.length === 0) return 0;
          const totalSpendOnThoseDays = this.transactions
            .filter(t => t.type === 'expense' && matchingDates.includes(t.date))
            .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);

          return Math.round(totalSpendOnThoseDays / matchingDates.length) || 0;
        },

        getMoodSpendingAvg(moodTag) {
          const avg = this.getMoodSpendingAvgRaw(moodTag);
          return this.formatCurrency(avg);
        },

        // Modal Handlers & Actions
        openNewEntryModal() {
          this.entryForm = {
            title: '',
            content: '',
            moodEmoji: '⚡',
            moodTag: 'Productive',
            gratitude1: '',
            gratitude2: '',
            gratitude3: '',
            location: '',
            weather: '☀️ 24°C',
            photo: null,
            isEncrypted: false,
            hasVoiceNote: false
          };
          this.playClick();
          this.showJournalModal = true;
        },

        openNewTransactionModal() {
          this.txForm = {
            type: 'expense',
            amount: '',
            category: 'Food',
            note: '',
            paymentMethod: 'Card',
            date: new Date().toISOString().split('T')[0]
          };
          this.playClick();
          this.showTransactionModal = true;
        },

        openQuickCreateMenu() {
          this.openNewEntryModal();
        },

        handlePhotoUpload(e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              this.entryForm.photo = event.target.result;
              this.playChime();
            };
            reader.readAsDataURL(file);
          }
        },

        saveJournalEntry() {
          if (!this.entryForm.title.trim()) return;

          const gratitudes = [this.entryForm.gratitude1, this.entryForm.gratitude2, this.entryForm.gratitude3]
            .map(g => g.trim())
            .filter(Boolean);

          const newEntry = {
            id: 'j-' + Date.now(),
            title: this.entryForm.title,
            content: this.entryForm.content,
            moodEmoji: this.entryForm.moodEmoji,
            moodTag: this.entryForm.moodTag,
            createdAt: new Date().toISOString(),
            isPinned: false,
            isEncrypted: this.entryForm.isEncrypted,
            gratitudes: gratitudes,
            location: this.entryForm.location || 'Local GPS',
            weather: this.entryForm.weather || '☀️ Clear',
            photo: this.entryForm.photo,
            tags: [this.entryForm.moodTag, 'LifeOS']
          };

          this.journals.unshift(newEntry);
          this.saveAll();
          this.showJournalModal = false;
          this.playSuccess();
          confetti({ particleCount: 70, spread: 70, origin: { y: 0.6 } });
        },

        togglePinJournal(id) {
          const entry = this.journals.find(j => j.id === id);
          if (entry) {
            entry.isPinned = !entry.isPinned;
            this.saveAll();
            this.playClick();
          }
        },

        deleteJournal(id) {
          this.journals = this.journals.filter(j => j.id !== id);
          this.saveAll();
          this.playClick();
        },

        saveTransaction() {
          if (!this.txForm.amount || Number(this.txForm.amount) <= 0) return;

          const newTx = {
            id: 't-' + Date.now(),
            type: this.txForm.type,
            amount: Number(this.txForm.amount),
            category: this.txForm.category,
            note: this.txForm.note,
            paymentMethod: this.txForm.paymentMethod,
            date: this.txForm.date || new Date().toISOString().split('T')[0]
          };

          this.transactions.unshift(newTx);
          this.saveAll();
          this.showTransactionModal = false;
          this.playSuccess();
          confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
        },

        deleteTransaction(id) {
          this.transactions = this.transactions.filter(t => t.id !== id);
          this.saveAll();
          this.playClick();
        },

        openRecurringModal() {
          const name = prompt(this.currentLang === 'ar' ? 'اسم الاشتراك (مثال: نيتفليكس، صالة رياضية):' : 'Subscription Name:');
          if (!name) return;
          const amt = prompt(this.currentLang === 'ar' ? 'المبلغ الشهري:' : 'Monthly Amount:');
          if (!amt || isNaN(amt)) return;

          this.subscriptions.push({
            id: 's-' + Date.now(),
            name: name,
            amount: Number(amt),
            cycle: 'month',
            icon: '🔄'
          });
          this.saveAll();
          this.playSuccess();
        },

        deleteSubscription(id) {
          this.subscriptions = this.subscriptions.filter(s => s.id !== id);
          this.saveAll();
          this.playClick();
        },

        saveSettings() {
          this.saveAll();
          this.playSuccess();
        },

        // Charts Initialization & Rendering (Lazy & Safe)
        initCharts(forceRecreate = false) {
          const ctxCash = document.getElementById('cashflowChart');
          const ctxCat = document.getElementById('categoryDonutChart');

          if (!ctxCash || !ctxCat) return;

          // If canvases have no width yet (hidden tab transition), skip
          if (ctxCash.offsetParent === null && !forceRecreate) return;

          const textColor = this.isDark ? '#94a3b8' : '#475569';
          const fontConfig = { family: 'Cairo, Inter, sans-serif', size: 11 };

          // Destroy existing instances if forcing re-creation
          if (forceRecreate || !window._lifeOSCharts.cashflow) {
            if (window._lifeOSCharts.cashflow) {
              window._lifeOSCharts.cashflow.destroy();
              window._lifeOSCharts.cashflow = null;
            }
            window._lifeOSCharts.cashflow = new Chart(ctxCash, {
              type: 'bar',
              data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [
                  {
                    label: this.t('income'),
                    data: [8000, 12000, 7500, 15000],
                    backgroundColor: 'rgba(16, 185, 129, 0.75)',
                    borderRadius: 8
                  },
                  {
                    label: this.t('expense'),
                    data: [4200, 5800, 3900, 6100],
                    backgroundColor: 'rgba(244, 63, 94, 0.75)',
                    borderRadius: 8
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: {
                    labels: { color: textColor, font: fontConfig }
                  }
                },
                scales: {
                  x: { grid: { display: false }, ticks: { color: textColor, font: fontConfig } },
                  y: { grid: { color: this.isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)' }, ticks: { color: textColor, font: fontConfig } }
                }
              }
            });
          }

          if (forceRecreate || !window._lifeOSCharts.category) {
            if (window._lifeOSCharts.category) {
              window._lifeOSCharts.category.destroy();
              window._lifeOSCharts.category = null;
            }

            const categories = ['Food', 'Housing', 'Tech', 'Health', 'Leisure'];
            const totals = categories.map(cat => {
              return this.transactions
                .filter(t => t.type === 'expense' && t.category === cat)
                .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
            });

            window._lifeOSCharts.category = new Chart(ctxCat, {
              type: 'doughnut',
              data: {
                labels: categories.map(c => this.t(c)),
                datasets: [{
                  data: totals.some(v => v > 0) ? totals : [35, 25, 20, 10, 10],
                  backgroundColor: ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#f43f5e'],
                  borderWidth: 0
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: {
                    position: 'bottom',
                    labels: { color: textColor, font: fontConfig }
                  }
                },
                cutout: '70%'
              }
            });
          } else {
            this.refreshCharts();
          }
        },

        refreshCharts() {
          if (!window._lifeOSCharts) return;

          const catChart = window._lifeOSCharts.category;
          const cashChart = window._lifeOSCharts.cashflow;

          if (catChart && catChart.data) {
            const categories = ['Food', 'Housing', 'Tech', 'Health', 'Leisure'];
            const totals = categories.map(cat => {
              return this.transactions
                .filter(t => t.type === 'expense' && t.category === cat)
                .reduce((acc, t) => acc + (Number(t.amount) || 0), 0);
            });
            catChart.data.datasets[0].data = totals.some(v => v > 0) ? totals : [35, 25, 20, 10, 10];
            catChart.data.labels = categories.map(c => this.t(c));
            catChart.update();
          }

          if (cashChart && cashChart.data) {
            cashChart.data.datasets[0].label = this.t('income');
            cashChart.data.datasets[1].label = this.t('expense');
            cashChart.update();
          }
        },

        // Data Sovereignty & Portability
        exportJSONBackup() {
          const payload = {
            version: 'LifeOS-v2.5',
            exportDate: new Date().toISOString(),
            currency: this.selectedCurrency,
            monthlyBudget: this.monthlyBudgetLimit,
            journals: this.journals,
            transactions: this.transactions,
            subscriptions: this.subscriptions
          };

          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `LifeOS_Backup_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
          this.playSuccess();
        },

        importJSONBackup(e) {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              if (data.journals && data.transactions) {
                this.journals = data.journals;
                this.transactions = data.transactions;
                if (data.subscriptions) this.subscriptions = data.subscriptions;
                if (data.currency) this.selectedCurrency = data.currency;
                if (data.monthlyBudget) this.monthlyBudgetLimit = data.monthlyBudget;
                this.saveAll();
                this.playSuccess();
                confetti({ particleCount: 100, spread: 80 });
              }
            } catch (err) {
              this.playTone(250, 'sawtooth', 0.2);
            }
          };
          reader.readAsText(file);
        },

        exportCSV() {
          let csv = 'ID,Type,Amount,Currency,Category,Note,Date,PaymentMethod\n';
          this.transactions.forEach(t => {
            csv += `"${t.id}","${t.type}",${t.amount},"${this.selectedCurrency}","${t.category}","${(t.note || '').replace(/"/g, '""')}","${t.date}","${t.paymentMethod}"\n`;
          });

          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `LifeOS_Financial_Ledger_${new Date().toISOString().split('T')[0]}.csv`;
          a.click();
          URL.revokeObjectURL(url);
          this.playSuccess();
        },

        factoryResetData() {
          const conf = prompt(this.currentLang === 'ar' ? 'اكتب "RESET" لتأكيد مسح كافة البيانات بشكل نهائي:' : 'Type "RESET" to confirm purging all data:');
          if (conf === 'RESET') {
            localStorage.clear();
            this.journals = [];
            this.transactions = [];
            this.subscriptions = [];
            this.seedDemoData();
            this.playTone(300, 'triangle', 0.3);
            location.reload();
          }
        }
      };
    }
  </script>
</body>
</html>
